services:
  - type: web
    name: r-solutions-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EDITOR_INVITE_CODE
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PORT
        value: 5002
